services:

  postgres:
    image: postgres:16-alpine
    container_name: robertgym_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: robertgym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aragon1002
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robertgym"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: robertgym_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  kiosko:
    build: ./kiosko
    container_name: robertgym_kiosko
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://backend:3000
    depends_on:
      - backend

  frontend-admin:
    build: ./frontend-admin
    container_name: robertgym_admin
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:3000
    depends_on:
      - backend

volumes:
  postgres_data:
